# ---------------------------------------------------------------------------
# Build & push the RunPod ACE-Step 4090 worker image to Docker Hub (amd64 only).
# Parallel to docker-build.yml but builds runpod/Dockerfile -> hrm3478938/acestep-runpod.
# Manual dispatch, OR auto-runs on any commit that touches runpod/.
# ---------------------------------------------------------------------------
name: runpod-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["runpod/**"]

env:
  IMAGE: acestep-runpod

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compose tags
        id: tags
        run: |
          TAGS="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE}:latest"
          TAGS="${TAGS},docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE}:${GITHUB_SHA::7}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./runpod/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max